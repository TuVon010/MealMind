spring:
  application:
    name: harness-agent
  datasource:
    url: jdbc:mysql://localhost:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
diet:
  llm:
    provider: openai-compatible
    api-key: "sk-xwS99BW8E7SevFeBF"
    base-url: "http://103.112.1.210:8317"
    main-model: deepseek-v4-flash
    light-model: deepseek-v4-flash
  session:
    max-history-turns: 6
  memory:
    enabled: true
    short-term-messages: 6
    message-max-chars: 160
    short-term-max-chars: 960
    summary-batch-size: 50
    summary-max-chars: 800
    summary-message-max-chars: 120
    long-term-limit: 20
    long-term-max-chars: 600
logging:
  level:
    com.diet: INFO
